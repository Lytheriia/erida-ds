name: Startup Tests

# TODO add health check with http requests

on:
  push:
  pull_request:

jobs:
  backend-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend-test .

      - name: Run backend container
        run: docker run -d --name backend-test -p 8080:8080 backend-test

      - name: Check backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health; then
              exit 0
            fi
              sleep 1
          done

          echo "Backend startup failed"

      - name: Show logs on failure
        if: failure()
        run: docker logs backend-test

      - name: Cleanup
        if: always()
        run: docker rm -f backend-test || true
