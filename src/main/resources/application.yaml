spring:
  application:
    name: bot-backend
  task:
    scheduling:
      pool-size: 2

  datasource:
    url: jdbc:postgresql://postgres:7777/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true

internal:
  api:
    key: ${INTERNAL_API_KEY}

server:
  port: ${BACKEND_PORT:8080}

discord:
  token: ${DISCORD_TOKEN}